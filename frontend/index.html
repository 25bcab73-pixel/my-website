<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>University Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; padding: 50px; font-family: sans-serif; }
        .container { max-width: 700px; background: white; padding: 30px; border-radius: 20px; shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .btn-primary { background: #4F46E5; border: none; }
    </style>
</head>
<body>

<div class="container shadow-sm">
    <h2 class="text-center mb-4">🎓 Student Records</h2>
    
    <div class="input-group mb-4">
        <input type="text" id="nameInput" class="form-control" placeholder="Enter Name">
        <button onclick="saveData()" class="btn btn-primary">Save Data</button>
    </div>

    <hr>
    <h4>📊 Dashboard</h4>
    <table class="table mt-3">
        <thead class="table-dark">
            <tr><th>Name</th><th>Time</th></tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<script>
    const API = 'http://localhost:3000'; // MATCHED WITH BACKEND

    async function saveData() {
        const name = document.getElementById('nameInput').value;
        if(!name) return;
        
        await fetch(`${API}/save`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ name: name, time: new Date().toLocaleString() })
        });
        
        document.getElementById('nameInput').value = "";
        fetchData(); // Dashboard refresh
    }

    async function fetchData() {
        try {
            const res = await fetch(`${API}/all-data`);
            const data = await res.json();
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = "";
            
            data.reverse().forEach(item => {
                tbody.innerHTML += `<tr><td>${item.name}</td><td>${item.time}</td></tr>`;
            });
        } catch (e) {
            console.log("Dashboard Error:", e);
        }
    }

    window.onload = fetchData;
</script>
</body>
</html>
